<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>DOVA Training · Outlook & DOVA Email</title><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet"/><style>*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:#060f1f;color:#E6EDF5;
  font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  line-height:1.5;min-height:100vh;
  background-image:radial-gradient(circle at 85% 8%,rgba(21,128,61,0.16),transparent 40%),
    radial-gradient(circle at 15% 92%,rgba(21,128,61,0.10),transparent 40%);
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0;}
input,textarea,select{font-family:inherit;}
p{margin:0;}h1,h2,h3,h4{margin:0;font-weight:normal;}
.container{max-width:960px;margin:0 auto;padding:0 20px;}

header.site{border-bottom:2px solid #16314f;background:rgba(0,0,0,.85);
  position:sticky;top:0;z-index:10;backdrop-filter:blur(8px);}
.header-row{max-width:960px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px;}
.logo-tile{width:40px;height:40px;background:#15803d;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.header-meta .small{font-family:'Roboto Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.3em;color:#4a6076;}
.header-meta .big{font-family:'Inter',sans-serif;font-size:18px;color:#fff;margin-top:2px;}
footer.site{max-width:960px;margin:0 auto;padding:28px 20px;border-top:1px solid #16314f;text-align:center;}
footer.site p{font-family:'Roboto Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.3em;color:#1e3a5f;}

.lab-hero{position:relative;border:2px solid #1e3a5f;background:#0B1F3D;overflow:hidden;margin-bottom:28px;}
.hero-grid{position:absolute;inset:0;opacity:.1;
  background-image:linear-gradient(rgba(21,128,61,.3) 1px,transparent 1px),linear-gradient(90deg,rgba(21,128,61,.3) 1px,transparent 1px);
  background-size:24px 24px;}
.hero-glow{position:absolute;top:-40px;right:-40px;width:220px;height:220px;
  background:#15803d;border-radius:50%;filter:blur(80px);opacity:.30;}
.lab-hero-inner{position:relative;padding:28px 24px;}
.lab-eyebrow{font-family:'Roboto Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.3em;color:#7fd1a3;margin-bottom:8px;}
.lab-h1{font-family:'Inter',sans-serif;font-size:clamp(40px,9vw,68px);color:#fff;line-height:.9;margin-bottom:14px;}
.lab-h1 .accent{color:#7fd1a3;}
.lab-blurb{color:#9FB3C8;max-width:560px;font-size:14px;line-height:1.7;margin-bottom:22px;}
.lab-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:460px;}
.lab-stat{border:1px solid #1e3a5f;background:rgba(0,0,0,.4);padding:8px 10px;}
.lab-stat-num{font-family:'Inter',sans-serif;font-size:24px;color:#7fd1a3;margin:0;}
.lab-stat-lbl{font-family:'Roboto Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.2em;color:#4a6076;margin:0;}

.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;}
.cat-card{text-align:left;background:#0B1F3D;border:2px solid #1e3a5f;padding:0;overflow:hidden;width:100%;}
.cat-card.is-done{border-color:#2A8C5A;}
.cat-stripe{height:6px;}
.cat-inner{padding:18px;}
.cat-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
.cat-icon-tile{width:44px;height:44px;color:#fff;display:flex;align-items:center;justify-content:center;}
.cat-card h3{font-family:'Inter',sans-serif;font-size:22px;color:#fff;margin:0 0 6px;line-height:1.05;}
.cat-card-blurb{font-size:12px;color:#9FB3C8;margin:0 0 14px;line-height:1.5;}
.cat-card-foot{display:flex;justify-content:space-between;align-items:center;
  font-family:'Roboto Mono',monospace;font-size:9px;color:#6b8099;text-transform:uppercase;letter-spacing:.2em;}
.cat-progress-track{height:4px;background:#16314f;flex:1;margin-left:12px;max-width:80px;}
.cat-progress-fill{height:100%;background:#2A8C5A;}

.cat-back-btn{font-family:'Roboto Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.2em;
  color:#6b8099;display:flex;align-items:center;gap:6px;margin-bottom:20px;}
.cat-header{background:#0B1F3D;border:2px solid #1e3a5f;padding:20px;margin-bottom:16px;}
.cat-header-inner{display:flex;gap:16px;align-items:flex-start;}
.cat-header-icon{width:56px;height:56px;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cat-header-eyebrow{font-family:'Roboto Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.3em;margin:0;}
.cat-header-title{font-family:'Inter',sans-serif;font-size:32px;color:#fff;margin:4px 0;line-height:1;}
.cat-header-blurb{color:#9FB3C8;font-size:13px;margin:0;line-height:1.5;}

.lesson-list{display:flex;flex-direction:column;gap:8px;}
.lesson-row{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#0B1F3D;
  border:2px solid #1e3a5f;width:100%;text-align:left;}
.lesson-row.is-done{border-color:#2A8C5A;}
.lesson-row.is-locked{opacity:.45;cursor:not-allowed;}
.lesson-row:not(.is-locked){cursor:pointer;}
.lesson-num-tile{width:30px;height:30px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-family:'Inter',sans-serif;font-size:16px;}
.lesson-num-tile.done   {background:#2A8C5A;color:#060f1f;}
.lesson-num-tile.current{background:#7fd1a3;color:#060f1f;}
.lesson-num-tile.pending{background:#16314f;color:#6b8099;}
.lesson-row-meta{flex:1;min-width:0;}
.lesson-row-title{font-family:'Inter',sans-serif;font-size:18px;color:#fff;margin:0;line-height:1.1;}
.lesson-row-tag{font-family:'Roboto Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.2em;margin:4px 0 0;}

.lesson-card{border:2px solid #1e3a5f;background:#0B1F3D;}
.lesson-card-header{color:#fff;padding:16px 20px;display:flex;align-items:center;gap:16px;border-bottom:2px solid #1e3a5f;}
.lesson-icon-tile{width:52px;height:52px;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.lesson-card-eyebrow{font-family:'Roboto Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.25em;font-weight:700;opacity:.85;margin:0;}
.lesson-card-title{font-family:'Inter',sans-serif;font-size:32px;margin:4px 0 0;line-height:1;color:#fff;}
.lesson-card-body{padding:24px 22px;}
.lesson-section{margin-bottom:22px;}
.lesson-section h3{font-family:'Inter',sans-serif;font-size:22px;color:#7fd1a3;margin:0 0 8px;}
.lesson-section p{color:#9FB3C8;line-height:1.65;margin:0;font-size:14px;}
.tip-box{background:rgba(21,128,61,.14);border-left:4px solid #15803d;padding:12px 16px;margin-top:20px;}
.tip-eyebrow{font-family:'Roboto Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.25em;color:#7fd1a3;margin:0 0 6px;font-weight:700;}
.tip-body{color:#bfdbfe;font-size:13px;margin:0;line-height:1.55;font-style:italic;}

.complete-btn{width:100%;margin-top:24px;padding:14px 0;
  font-family:'Inter',sans-serif;font-size:18px;letter-spacing:.2em;
  background:#15803d;color:#fff;border:2px solid #15803d;
  display:flex;align-items:center;justify-content:center;gap:10px;}

.pile-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px;}
@media (max-width:600px){ .pile-grid{grid-template-columns:1fr 1fr;} }
.pile-tile{background:#0a1830;border:1px solid #1e3a5f;border-top:3px solid #15803d;padding:10px 10px;}
.pile-name{font-family:'Inter',sans-serif;font-size:18px;color:#7fd1a3;margin:0 0 4px;line-height:1;}
.pile-body{font-size:11px;color:#9FB3C8;line-height:1.45;margin:0;}

.int-card{border:2px solid #1e3a5f;background:#0B1F3D;}
.int-card-header{color:#fff;padding:16px 20px;display:flex;align-items:center;gap:16px;border-bottom:2px solid #1e3a5f;}
.int-card-body{padding:24px 22px;}

.mib-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media (max-width:720px){ .mib-grid{grid-template-columns:1fr;} }
.mib-col h4{font-family:'Roboto Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.25em;color:#7fd1a3;margin:0 0 12px;}
.mib-field{margin-bottom:12px;}
.mib-label{font-family:'Roboto Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.2em;color:#6b8099;margin-bottom:4px;display:block;}
.mib-input,.mib-textarea,.mib-select{
  width:100%;background:#0a1830;border:1px solid #1e3a5f;color:#E6EDF5;
  padding:8px 10px;font-size:13px;outline:none;font-family:inherit;
}
.mib-input:focus,.mib-textarea:focus,.mib-select:focus{border-color:#15803d;}
.mib-textarea{resize:vertical;min-height:60px;line-height:1.5;font-size:12px;}

.invite-preview{background:#0a1830;border:1px solid #1e3a5f;padding:0;overflow:hidden;}
.invite-preview-head{background:#15803d;color:#fff;padding:10px 14px;}
.invite-preview-head h5{font-family:'Inter',sans-serif;font-size:20px;margin:0;line-height:1.1;}
.invite-preview-head p{font-family:'Roboto Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.2em;opacity:.85;margin:2px 0 0;}
.invite-preview-body{padding:12px 14px;}
.invite-row{display:flex;gap:10px;font-size:12px;color:#9FB3C8;padding:5px 0;border-bottom:1px dashed #16314f;}
.invite-row:last-child{border-bottom:none;}
.invite-row-key{font-family:'Roboto Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.15em;color:#6b8099;width:80px;flex-shrink:0;padding-top:1px;}
.invite-row-val{flex:1;color:#E6EDF5;line-height:1.5;white-space:pre-line;}
.invite-empty{color:#4a6076;font-style:italic;}

.mib-check-btn{margin-top:16px;padding:10px 18px;font-family:'Inter',sans-serif;font-size:14px;letter-spacing:.2em;
  background:#15803d;color:#fff;border:2px solid #15803d;}
.mib-feedback{margin-top:14px;padding:12px 14px;font-size:12px;line-height:1.6;}
.mib-feedback.ok{background:rgba(16,185,129,.08);border:1px solid #2A8C5A;color:#a7f3d0;}
.mib-feedback.bad{background:rgba(239,68,68,.08);border:1px solid #ef4444;color:#fca5a5;}
.mib-feedback.warn{background:rgba(250,204,21,.08);border:1px solid #2E6FDB;color:#fde68a;}
.mib-feedback ul{margin:6px 0 0;padding-left:18px;}
.mib-feedback li{margin-bottom:3px;}

.drill-stage{background:#0a1830;border:1px solid #1e3a5f;padding:18px;margin-bottom:14px;}
.drill-tag{font-family:'Roboto Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.2em;color:#7fd1a3;margin-bottom:8px;}
.drill-scenario{background:#1c1917;border-left:3px solid #15803d;padding:12px 14px;margin-bottom:14px;}
.drill-from{font-family:'Roboto Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:#7fd1a3;margin-bottom:4px;}
.drill-subject{font-size:13px;color:#E6EDF5;font-weight:600;margin-bottom:4px;}
.drill-body{font-size:12px;color:#9FB3C8;line-height:1.5;}
.drill-btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;}
.drill-btn{padding:12px 8px;background:#09090b;border:1px solid #1e3a5f;font-family:'Inter',sans-serif;font-size:13px;letter-spacing:.05em;color:#9FB3C8;line-height:1.2;display:flex;flex-direction:column;align-items:center;gap:4px;}
.drill-btn:hover{border-color:#7fd1a3;}
.drill-btn small{font-family:'Roboto Mono',monospace;font-size:8px;text-transform:uppercase;letter-spacing:.15em;color:#4a6076;}
.drill-btn.picked-correct{background:rgba(16,185,129,.15);border-color:#2A8C5A;color:#a7f3d0;}
.drill-btn.picked-correct small{color:#6ee7b7;}
.drill-btn.picked-wrong{background:rgba(239,68,68,.1);border-color:#ef4444;color:#fca5a5;}
.drill-btn.correct-shown{background:rgba(16,185,129,.08);border-color:#2A8C5A;color:#a7f3d0;}
.drill-btn.correct-shown small{color:#6ee7b7;}
.feedback{margin-top:14px;padding:10px 14px;font-size:12px;line-height:1.55;}
.feedback.ok{background:rgba(16,185,129,.08);border:1px solid #2A8C5A;color:#a7f3d0;}
.feedback.bad{background:rgba(239,68,68,.08);border:1px solid #ef4444;color:#fca5a5;}

.sim-buttons{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;}
.sim-btn{padding:12px 8px;background:#09090b;border:1px solid #1e3a5f;
  font-family:'Inter',sans-serif;font-size:13px;letter-spacing:.05em;color:#9FB3C8;line-height:1.2;}
.sim-btn:hover{border-color:#7fd1a3;}
.sim-btn.picked-correct{background:rgba(16,185,129,.15);border-color:#2A8C5A;color:#a7f3d0;}
.sim-btn.picked-wrong{background:rgba(239,68,68,.1);border-color:#ef4444;color:#fca5a5;}
.sim-btn.correct-shown{background:rgba(16,185,129,.08);border-color:#2A8C5A;color:#a7f3d0;}

.next-btn{padding:10px 18px;font-family:'Inter',sans-serif;font-size:14px;letter-spacing:.2em;
  background:#15803d;color:#fff;border:2px solid #15803d;}
.score-line{font-family:'Roboto Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.15em;
  color:#9FB3C8;margin-top:16px;padding-top:14px;border-top:1px solid #16314f;}

.compose{background:#0a1830;border:1px solid #1e3a5f;overflow:hidden;}
.compose-bar{background:#15803d;color:#fff;padding:8px 12px;font-family:'Roboto Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;}
.compose-row{display:flex;gap:8px;padding:7px 12px;border-bottom:1px solid #16314f;font-size:12px;}
.compose-key{font-family:'Roboto Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.15em;color:#6b8099;width:54px;flex-shrink:0;padding-top:2px;}
.compose-val{flex:1;color:#E6EDF5;line-height:1.4;}
.compose-body{padding:12px;font-size:12px;color:#E6EDF5;line-height:1.6;white-space:pre-line;min-height:84px;}
.compose-sig{padding:10px 12px 12px;border-top:1px dashed #16314f;font-size:11px;color:#9FB3C8;line-height:1.5;}
.compose-empty{color:#4a6076;font-style:italic;}
.sigcard{background:#0a1830;border:1px solid #1e3a5f;border-left:3px solid #15803d;padding:12px 14px;margin-top:6px;font-size:12px;color:#E6EDF5;line-height:1.6;}
.sigcard b{color:#7fd1a3;}
.annot{background:#0a1830;border:1px solid #1e3a5f;padding:0;margin-top:6px;overflow:hidden;}
.annot-row{display:flex;gap:10px;padding:9px 12px;border-bottom:1px solid #16314f;}
.annot-row:last-child{border-bottom:none;}
.annot-tag{font-family:'Roboto Mono',monospace;font-size:8px;text-transform:uppercase;letter-spacing:.15em;color:#7fd1a3;width:64px;flex-shrink:0;padding-top:2px;}
.annot-txt{flex:1;font-size:12px;color:#E6EDF5;line-height:1.5;}
.mini-tbl{width:100%;border-collapse:collapse;margin-top:6px;font-size:11px;}
.mini-tbl th{font-family:'Roboto Mono',monospace;font-size:8px;text-transform:uppercase;letter-spacing:.12em;color:#7fd1a3;text-align:left;padding:6px 8px;border-bottom:1px solid #1e3a5f;background:#0a1830;}
.mini-tbl td{padding:6px 8px;border-bottom:1px solid #16314f;color:#E6EDF5;}
.split2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px;}
@media(max-width:600px){.split2{grid-template-columns:1fr;}}
.split2 .col{background:#0a1830;border:1px solid #1e3a5f;padding:10px 12px;}
.split2 .col h5{font-family:'Inter',sans-serif;font-size:16px;margin:0 0 6px;color:#7fd1a3;}
.split2 .col p{font-size:11px;color:#9FB3C8;line-height:1.5;margin:0;}
.week-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px;}
@media(max-width:600px){.week-grid{grid-template-columns:1fr 1fr;}}
.week-day{background:#0a1830;border:1px solid #1e3a5f;padding:10px 8px;}
.week-day-name{font-family:'Inter',sans-serif;font-size:16px;color:#7fd1a3;margin:0 0 6px;}
.week-day-tag{font-family:'Roboto Mono',monospace;font-size:8px;text-transform:uppercase;letter-spacing:.15em;color:#6b8099;margin:0 0 6px;}
.week-day-body{font-size:11px;color:#9FB3C8;line-height:1.4;margin:0;}

const LESSON_CONTENT={"e-1": {"sections": [{"h": "A place for things", "b": "Folders keep the inbox from becoming a pile. A few simple folders, by project or by sender, are enough. The goal is that anything important has an obvious home and you can find it later."}, {"h": "Flag what needs you", "b": "A flag marks an email that needs an action from you. Flag it, and the inbox becomes a to-do list. Clear the flag when the action is done. Do not flag everything, or the flags stop meaning anything."}], "tip": "Flags are for things you must act on, not things you found interesting. Keep the flagged list short enough to actually clear."}, "e-2": {"sections": [{"h": "Search beats scrolling", "b": "Outlook search is fast and good. Type the sender, a word from the subject, or a phrase, and it finds the message. Searching is quicker than scrolling and you will not miss the one you wanted."}, {"h": "Narrow it down", "b": "If a search returns too much, add another word or filter by date or sender. Two specific words usually beat one common one. The point is to land on the right message in seconds."}], "tip": "Stop scrolling for old email. Search the sender or a word from the subject. It is faster every time."}, "e-3": {"sections": [{"h": "Inbox is not storage", "b": "An inbox is a landing strip, not a warehouse. Read it, act or file or delete, and move on. A clean inbox is calmer and you are less likely to lose something important under the noise."}, {"h": "Touch it once", "b": "Where you can, deal with a message the first time you open it. Reply, file, or delete. Opening the same email five times without acting is wasted time and a fuller inbox."}], "tip": "Try to handle a message the first time you open it. Reply, file, or delete. Re-reading the same email is lost time."}, "e-4": {"sections": [{"h": "Say what it is", "b": "A good subject line tells the reader what the email is and what you want, before they open it. Quote needed by Friday beats Question. The reader should be able to triage from the subject alone."}, {"h": "One topic per email", "b": "Keep an email to one topic and say that topic in the subject. Two topics in one email means one gets missed. Split them. It makes both easier to answer and to find later."}], "tip": "If the subject line is just Hi or Question, rewrite it. Name the thing and the ask. The reader sorts their day by subject lines."}, "e-5": {"sections": [{"h": "Short and clear", "b": "Most email should be a few short lines. Say what you need, by when, and stop. A wall of text gets skimmed and the ask gets lost. Lead with the request, then add detail below if needed."}, {"h": "Make the ask obvious", "b": "If you need something, the reader should see exactly what and when. Please confirm the date by Thursday is a clear ask. Let me know your thoughts is not. Be specific about the action you want."}], "tip": "Put the ask in the first line, not the last. A reader who skims should still know what you need from them."}, "e-6": {"sections": [{"h": "Reply versus reply all", "b": "Reply goes to the sender. Reply all goes to everyone on the email. Most of the time you want reply. Use reply all only when everyone genuinely needs your message. Wrong reply all is noise at best."}, {"h": "Forward with care", "b": "Forwarding sends the whole thread onward, including everything written above. Before you forward, read what is in the chain. You are responsible for what you pass along, not just your part."}], "tip": "Before you hit reply all, ask whether everyone needs this. Usually they do not. And before you forward, read the whole chain you are about to send."}, "e-7": {"sections": [{"h": "Check the name in To", "b": "The most common email mistake is the wrong recipient. Outlook autofills names and the wrong one is one letter away. Read the To line before sending, especially when the email is sensitive."}, {"h": "Right file, attached", "b": "Two attachment mistakes. The wrong file, and no file at all. Open the attachment to confirm it is the right one, and check it is actually attached before you hit send. A quick look saves a follow-up."}], "tip": "The two-second check before send is the whole game. Read the To line. Confirm the attachment is the right file and is actually attached."}};

  var w=WIDGETS[key];var p=w.prefix;var idx=state[p+'Idx'];var list=w.scenarios;var s=list[idx];
  var picked=state[p+'Picked'][s.id];var revealed=state[p+'Revealed'][s.id];
  var total=list.length;var allDone=list.every(function(x){return state[p+'Revealed'][x.id];});
  var correctCount=list.filter(function(x){return state[p+'Picked'][x.id]===x.correct;}).length;
  var html='';
  html+='<button class="cat-back-btn" data-action="back-cat" data-cat-id="'+cat.id+'">'+icon('arrow-left',13)+' Back to '+esc(cat.title)+'</button>';
  html+='<div class="int-card"><div class="int-card-header" style="background:'+cat.color+';">'+
    '<div class="lesson-icon-tile">'+icon(w.icon,26,'#fff')+'</div>'+
    '<div><p class="lesson-card-eyebrow">'+esc(cat.title)+' &middot; ~'+lesson.minutes+' min</p><h2 class="lesson-card-title">'+esc(lesson.title)+'</h2></div></div>';
  html+='<div class="int-card-body"><p style="font-size:13px;color:#a1a1aa;margin-bottom:16px;">'+esc(w.intro)+'</p>';
  html+='<div class="drill-stage"><p class="drill-tag">'+esc(w.unit||'Item')+' '+(idx+1)+' of '+total+'</p>';
  if(s.grid)html+=gridHtml(s.grid);
  html+='<div class="drill-scenario">';
  if(s.card){html+=s.card;}
  else{
    if(s.from)html+='<div class="drill-from">'+esc((s.fromLabel||'From')+': '+s.from)+'</div>';
    if(s.subject)html+='<div class="drill-subject">'+esc(s.subject)+'</div>';
    html+='<div class="drill-body">'+esc(s.body)+'</div>';
  }
  html+='</div>';
  if(w.btn==='drill'){
    html+='<div class="drill-btns">';
    w.actions.forEach(function(a){
      var cls='drill-btn';
      if(revealed){if(a.id===s.correct)cls+=picked===a.id?' picked-correct':' correct-shown';else if(a.id===picked)cls+=' picked-wrong';}
      html+='<button class="'+cls+'" data-action="q-pick" data-key="'+key+'" data-act="'+esc(a.id)+'"><span>'+esc(a.name)+'</span><small>'+esc(a.sub)+'</small></button>';
    });
    html+='</div>';
  } else {
    var acts=s.opts||w.actions;
    html+='<div class="sim-buttons">';
    acts.forEach(function(a){
      var cls='sim-btn';
      if(revealed){if(a===s.correct)cls+=picked===a?' picked-correct':' correct-shown';else if(a===picked)cls+=' picked-wrong';}
      html+='<button class="'+cls+'" data-action="q-pick" data-key="'+key+'" data-act="'+esc(a)+'">'+esc(a)+'</button>';
    });
    html+='</div>';
  }
  if(revealed){
    var ok=picked===s.correct;var label;
    if(w.btn==='drill'){var ca=w.actions.filter(function(a){return a.id===s.correct;})[0];label=ca?ca.name:s.correct;}
    else label=s.correct;
    html+='<div class="feedback '+(ok?'ok':'bad')+'">'+(ok?'Correct. ':'Answer: '+esc(label)+'. ')+esc(s.why)+'</div>';
    if(idx<total-1)html+='<div style="text-align:right;margin-top:12px;"><button class="next-btn" data-action="q-next" data-key="'+key+'">Next '+icon('arrow-right',14,'#fff')+'</button></div>';
  }
  html+='</div>';
  if(allDone){
    html+='<div class="score-line">'+icon('check',13,'#86efac')+' Score: '+correctCount+'/'+total+'</div>';
    html+='<button class="complete-btn" data-action="complete-lesson" data-lesson-id="'+lesson.id+'">Mark complete '+icon('arrow-right',16,'#fff')+'</button>';
  }
  html+='</div></div>';return html;
}
function renderLesson(lesson,cat){
  if(lesson.type==='reading')return renderReading(lesson,cat);
  var w=WIDGETS[lesson.intKey];
  if(w&&w.family==='builder')return renderBuilder(lesson.intKey,lesson,cat);
  if(w)return renderQuiz(lesson.intKey,lesson,cat);
  return renderReading(lesson,cat);
}
function initWidget(key){
  var w=WIDGETS[key];if(!w)return;
  if(w.family==='builder'){
    state[w.prefix+'Checked']=false;state[w.prefix+'Feedback']=null;
    w.fields.forEach(function(f){state[w.prefix+f.key]=(f.def!=null?f.def:'');});
  } else {
    state[w.prefix+'Idx']=0;state[w.prefix+'Picked']={};state[w.prefix+'Revealed']={};
  }
}
Object.keys(WIDGETS).forEach(initWidget);
function render(){
  var app=document.getElementById('app');var html='';
  if(state.view==='home'){html=renderHome();}
  else if(state.view.indexOf('category:')===0){var cat=getCat(state.view.slice(9));html=cat?renderCategory(cat):renderHome();}
  else if(state.view.indexOf('lesson:')===0){var info=getLesson(state.view.slice(7));html=info?renderLesson(info.lesson,info.cat):renderHome();}
  app.innerHTML=html;
  if(state.view.indexOf('lesson:')===0){
    var info2=getLesson(state.view.slice(7));
    if(info2&&info2.lesson.intKey){
      var w=WIDGETS[info2.lesson.intKey];
      if(w&&w.family==='builder'){
        var key=info2.lesson.intKey;
        setTimeout(function(){
          document.querySelectorAll('[data-w]').forEach(function(el){
            el.addEventListener('input',function(e){
              var pre=e.target.getAttribute('data-w');var fld=e.target.getAttribute('data-f');
              state[pre+fld]=e.target.value;state[pre+'Checked']=false;state[pre+'Feedback']=null;
              var pv=document.getElementById('mib-preview');if(pv)pv.innerHTML=buildPreviewInner(key);
            });
          });
        },50);
      }
    }
  }
}
document.body.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-action]');if(!t)return;
  var action=t.getAttribute('data-action');
  if(action==='open-cat'){state.view='category:'+t.getAttribute('data-cat-id');render();window.scrollTo({top:0,behavior:'smooth'});}
  else if(action==='back-home'){state.view='home';render();window.scrollTo({top:0,behavior:'smooth'});}
  else if(action==='back-cat'){state.view='category:'+t.getAttribute('data-cat-id');render();window.scrollTo({top:0,behavior:'smooth'});}
  else if(action==='open-lesson'){var lid=t.getAttribute('data-lesson-id');var info=getLesson(lid);if(info&&info.lesson.intKey){initWidget(info.lesson.intKey);}state.view='lesson:'+lid;render();window.scrollTo({top:0,behavior:'smooth'});}
  else if(action==='complete-lesson'){var lid2=t.getAttribute('data-lesson-id');state.completed[lid2]=true;if(window.DOVASaveProgress)window.DOVASaveProgress(lid2);var info2=getLesson(lid2);if(info2){var next=null;for(var i=0;i<info2.cat.lessons.length;i++){if(info2.cat.lessons[i].id===lid2&&i+1<info2.cat.lessons.length){next=info2.cat.lessons[i+1];break;}}state.view=next?'lesson:'+next.id:'category:'+info2.cat.id;render();window.scrollTo({top:0,behavior:'smooth'});}}
  else if(action==='w-check'){var k1=t.getAttribute('data-key');var w1=WIDGETS[k1];state[w1.prefix+'Feedback']=w1.validate();state[w1.prefix+'Checked']=true;render();}
  else if(action==='q-pick'){var k2=t.getAttribute('data-key');var w2=WIDGETS[k2];var sc=w2.scenarios[state[w2.prefix+'Idx']];if(state[w2.prefix+'Revealed'][sc.id])return;state[w2.prefix+'Picked'][sc.id]=t.getAttribute('data-act');state[w2.prefix+'Revealed'][sc.id]=true;render();}
  else if(action==='q-next'){var k3=t.getAttribute('data-key');var w3=WIDGETS[k3];if(state[w3.prefix+'Idx']<w3.scenarios.length-1){state[w3.prefix+'Idx']++;render();}}
});



var SB=null; try{ if(window.supabase && window.DOVA_CFG){ SB=window.supabase.createClient(window.DOVA_CFG.url, window.DOVA_CFG.anon); } }catch(e){ console.warn('sb init',e); }
window._sb=SB;
window.DOVASaveProgress=async function(lid){ if(!window._uid||!SB)return;
  try{ await SB.from('module_progress').upsert({user_id:window._uid,module_id:MODULE_ID,lesson_id:lid,completed:true},{onConflict:'user_id,module_id,lesson_id'}); }catch(e){console.warn('save',e);} };
(async function(){
  try{
    if(!SB){ Object.keys(WIDGETS).forEach(initWidget); var ls0=document.getElementById('logo-slot'); if(ls0) ls0.innerHTML=icon(LOGO_ICON,22,'#fff'); render(); return; }
    const r=await SB.auth.getSession(); const session=r.data&&r.data.session;
    if(!session){ location.replace('index.html'); return; }
    window._uid=session.user.id;
    try{ const q=await SB.from('module_progress').select('lesson_id').eq('user_id',session.user.id).eq('module_id',MODULE_ID).eq('completed',true);
         (q.data||[]).forEach(function(row){ state.completed[row.lesson_id]=true; }); }catch(e){}
  }catch(e){ console.warn('auth',e); }
  Object.keys(WIDGETS).forEach(initWidget);
  var ls=document.getElementById('logo-slot'); if(ls) ls.innerHTML=icon(LOGO_ICON,22,'#fff');
  render();
})();
